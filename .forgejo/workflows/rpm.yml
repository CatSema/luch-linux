name: RPM
on:
  push: { branches: [main, dev] }
  workflow_dispatch:
jobs:
  rpm:
    runs-on: als-huge
    container:
      image: altlinux.space/alt-gnome/hasherc:latest
    steps:
      - name: Install tools
        run: apt-get update && apt-get install -y jq /usr/bin/add_changelog fuse-overlayfs git rust rust-cargo
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Prepare package
        run: ./build-aux/altlinux/prepare && git add -f luch.spec .gear/rules vendor .cargo && git add .
      - uses: actions/build-rpm-action@main
        with: { branch: sisyphus, arch: amd64 }
      - uses: actions/upload-rpm-action@main
        with:
          directory: ~/.cache/hasherc/luch/out/RPMS
          token: ${{ secrets.REGISTRY_TOKEN }}
          group: ${{ github.ref_name == 'main' && 'atomic-niri-main/sisyphus' || 'atomic-niri-dev/sisyphus' }}
