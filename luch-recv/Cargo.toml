[package]
name = "luch-recv"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Luch receiver for Linux: shows a phone's (or any sender's) screen in a floating window"

[dependencies]
luch-proto.workspace = true
zbus.workspace = true
tokio.workspace = true
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
gstreamer = "0.25.4"
gstreamer-app = { version = "0.25.2", features = ["v1_24"] }
socket2 = { version = "0.6.5", features = ["all"] }
